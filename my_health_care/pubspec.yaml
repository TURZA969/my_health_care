name: my_health_care
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.2.2
  firebase_storage: ^13.4.2
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6
  open_file: ^3.3.2
  file_picker: ^8.1.6
  flutter_timezone: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - lib/assets/logo.png

flutter_launcher_icons:
  android: true
